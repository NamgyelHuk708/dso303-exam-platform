AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Online exam platform (DSO303, NamgyelW) - lean deployment of the production design.
  Layer 2: exam API (autosave, submit, presigned upload) and async upload notification
  (S3 -> SQS + DLQ -> Lambda -> SNS email). DynamoDB is multi-AZ by design, PITR on.

Parameters:
  NotifyEmail:
    Type: String
    Description: Address that receives upload notifications (SNS email subscription)

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 15
  HttpApi:
    CorsConfiguration:
      AllowOrigins:
        - !Sub 'https://${FrontendDistribution.DomainName}'
      AllowMethods: [GET, PUT, POST, OPTIONS]
      AllowHeaders: [content-type]
      MaxAge: 600

Resources:
  # ---------- Database: DynamoDB replicates across AZs automatically ----------
  ExamTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: false

  # ---------- File storage: submissions with 5-year lifecycle + upload events ----------
  SubmissionsBucket:
    Type: AWS::S3::Bucket
    DependsOn: UploadQueuePolicy
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: tier-down-and-keep-5-years
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
              - StorageClass: GLACIER
                TransitionInDays: 180
            ExpirationInDays: 1825
          - Id: abort-incomplete-multipart-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Sub 'https://${FrontendDistribution.DomainName}'
            AllowedMethods: [POST]
            AllowedHeaders: ['*']
            MaxAge: 600
      NotificationConfiguration:
        QueueConfigurations:
          - Event: 's3:ObjectCreated:*'
            Queue: !GetAtt UploadQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: submissions/

  SubmissionsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SubmissionsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt SubmissionsBucket.Arn
              - !Sub '${SubmissionsBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  # ---------- Async: queue + dead-letter queue between S3 and the notifier ----------
  UploadDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  UploadQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 90
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt UploadDLQ.Arn
        maxReceiveCount: 3

  UploadQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref UploadQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowOnlyOurSubmissionsBucket
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: 'sqs:SendMessage'
            Resource: !GetAtt UploadQueue.Arn
            Condition:
              ArnLike:
                'aws:SourceArn': !Sub 'arn:aws:s3:::${AWS::StackName}-submissionsbucket-*'
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId

  NotificationsTopic:
    Type: AWS::SNS::Topic

  NotifyEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref NotificationsTopic
      Protocol: email
      Endpoint: !Ref NotifyEmail

  # ---------- Frontend: private S3 bucket served only through CloudFront (OAC) ----------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowOnlyOurCloudFrontDistribution
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: 's3:GetObject'
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt FrontendBucket.Arn
              - !Sub '${FrontendBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${AWS::StackName} exam frontend'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: frontend-s3
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: frontend-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # AWS managed: CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # AWS managed: SecurityHeadersPolicy

  # ---------- Compute ----------
  HealthLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: health.handler
      LoggingConfig:
        LogGroup: !Ref HealthLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref ExamTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ExamTable
      Events:
        Health:
          Type: HttpApi
          Properties:
            Path: /health
            Method: GET

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: api.handler
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref ExamTable
          BUCKET_NAME: !Ref SubmissionsBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ExamTable
        - Statement:
            - Effect: Allow
              Action: 's3:PutObject'
              Resource: !Sub '${SubmissionsBucket.Arn}/submissions/*'
      Events:
        GetExam:
          Type: HttpApi
          Properties:
            Path: /exam/{examId}
            Method: GET
        Autosave:
          Type: HttpApi
          Properties:
            Path: /exam/{examId}/autosave
            Method: PUT
        Submit:
          Type: HttpApi
          Properties:
            Path: /exam/{examId}/submit
            Method: POST
        UploadUrl:
          Type: HttpApi
          Properties:
            Path: /upload-url
            Method: POST

  NotifierLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7

  NotifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: notifier.handler
      LoggingConfig:
        LogGroup: !Ref NotifierLogGroup
      Environment:
        Variables:
          TABLE_NAME: !Ref ExamTable
          TOPIC_ARN: !Ref NotificationsTopic
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ExamTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt NotificationsTopic.TopicName
      Events:
        Uploads:
          Type: SQS
          Properties:
            Queue: !GetAtt UploadQueue.Arn
            BatchSize: 1

Outputs:
  ApiUrl:
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  TableName:
    Value: !Ref ExamTable
  SubmissionsBucketName:
    Value: !Ref SubmissionsBucket
  ApiLogGroup:
    Value: !Ref ApiLogGroup
  NotifierLogGroup:
    Value: !Ref NotifierLogGroup
  UploadDLQUrl:
    Value: !Ref UploadDLQ
  FrontendUrl:
    Value: !Sub 'https://${FrontendDistribution.DomainName}'
  FrontendBucketName:
    Value: !Ref FrontendBucket
  DistributionId:
    Value: !Ref FrontendDistribution
